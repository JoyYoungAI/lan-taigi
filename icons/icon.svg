<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Sound Waves / Resonance curves -->
  <path d="M 120 256 Q 160 210, 200 256 T 280 256 T 360 256 T 400 256" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Center Emblem: Taiwan Island + Stylized '台' Character -->
  <g filter="url(#shadow)">
    <!-- Central Sound Badge -->
    <circle cx="256" cy="235" r="130" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
    
    <!-- Big '台' Hanzi stylized -->
    <text x="256" y="275" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle" letter-spacing="2">台</text>
    
    <!-- Accent Tone Mark on top right -->
    <path d="M 330 145 Q 355 130, 365 155" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Banner: '咱的台語' -->
  <rect x="96" y="380" width="320" height="64" rx="32" fill="#ffffff" filter="url(#shadow)"/>
  <text x="256" y="424" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="28" fill="#1b5e20" text-anchor="middle" letter-spacing="4">咱的台語</text>
  
  <!-- Latin Subtitle -->
  <text x="256" y="475" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="rgba(255,255,255,0.85)" text-anchor="middle" letter-spacing="3">LÁN Ê TÂI-GÍ</text>
</svg>
